<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工廠</title>
<style>
  :root { --bg:#0f1218; --panel:#171c26; --line:#2a3242; --text:#e6eaf2; --mute:#8b95a8;
          --idle:#5b6578; --run:#3b82f6; --done:#22c55e; --fail:#ef4444; --wait:#f59e0b; --off:#3a3f4b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Noto Sans TC",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; } #conn { font-size:12px; color:var(--mute); }
  main { display:grid; grid-template-columns:1fr 380px; gap:16px; padding:16px 20px; }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--mute); font-weight:600; letter-spacing:.04em; }
  .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
  #factory { display:flex; flex-wrap:wrap; gap:12px; }
  .node { flex:1 1 170px; min-width:170px; border:2px solid var(--idle); border-radius:10px; padding:10px 12px; background:#10141c; transition:.2s; }
  .node .name { font-weight:600; } .node .role { color:var(--mute); font-size:12px; overflow-wrap:anywhere; }
  .node .st { margin-top:6px; font-size:12px; display:flex; align-items:center; gap:6px; }
  .node .tools { display:flex; gap:6px; align-items:center; margin-top:8px; }
  .node .tools select { flex:1; min-width:0; padding:3px 6px; font-size:12px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--idle); }
  .node.running { border-color:var(--run); box-shadow:0 0 14px #3b82f655; } .node.running .dot { background:var(--run); animation:p 1s infinite; }
  .node.waiting { border-color:var(--wait); box-shadow:0 0 14px #f59e0b55; } .node.waiting .dot { background:var(--wait); animation:p 1s infinite; }
  .node.failed { border-color:var(--fail); } .node.failed .dot { background:var(--fail); }
  .node.offline { border-color:var(--off); } .node.offline .dot { background:var(--off); }
  .node.offline .name, .node.offline .st { opacity:.6; }
  @keyframes p { 50% { opacity:.3; } }
  .belt { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .stage { padding:6px 12px; border-radius:20px; border:1px solid var(--line); font-size:12px; color:var(--mute); }
  .stage.current { border-color:var(--run); color:var(--text); background:#3b82f622; }
  .stage.past { border-color:var(--done); color:var(--done); }
  .arrow { color:var(--mute); }
  .task { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .badge { font-size:11px; padding:1px 8px; border-radius:10px; background:var(--line); }
  .badge.running{background:var(--run)} .badge.done{background:var(--done);color:#000} .badge.blocked{background:var(--fail)} .badge.waiting_user{background:var(--wait);color:#000}
  .badge.cancelled, .badge.interrupted {background:var(--off)}
  .pipe { margin-bottom:12px; } .pipe:last-child { margin-bottom:0; }
  .pipe-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .task .meta { font-size:12px; color:var(--mute); }
  .task .acts { float:right; display:flex; gap:4px; }
  .task details summary { cursor:pointer; font-size:12px; color:var(--mute); margin-top:6px; }
  .ask { border:2px solid var(--wait); background:#f59e0b14; border-radius:10px; padding:10px; margin-bottom:10px; }
  input,textarea,select,button { font:inherit; color:var(--text); background:#0f1218; border:1px solid var(--line); border-radius:6px; padding:7px 9px; }
  button { background:var(--run); border-color:var(--run); cursor:pointer; } button:disabled{opacity:.5; cursor:default}
  textarea { width:100%; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; } .row > input { flex:1; min-width:0; }
  #log, #chat { height:240px; overflow:auto; font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; }
  .me { color:var(--run); } .ai { color:var(--text); } .err { color:var(--fail); } .src { color:var(--mute); }
  .out { margin-top:6px; font-size:12px; color:var(--mute); white-space:pre-wrap; max-height:140px; overflow:auto; }
  .out.live { color:var(--text); border-left:2px solid var(--run); padding-left:8px; }
  button.ghost { background:transparent; border-color:var(--line); font-size:12px; padding:2px 8px; }
  button.plain { background:transparent; border-color:var(--line); }
  button.danger { background:transparent; border-color:var(--fail); color:var(--fail); }
  h2 button.ghost { float:right; margin-top:-3px; }
  .acct { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .acct .head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .acct .head .btns { margin-left:auto; display:flex; gap:4px; }
  .acct .url { font-size:11px; word-break:break-all; margin-top:4px; } a { color:var(--run); }
  .tag { font-size:11px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--mute); }
  .hint { font-size:12px; color:var(--mute); margin-top:4px; }
  .error { color:var(--fail); font-size:12px; margin-top:6px; min-height:1em; }
  .panel { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:12px; background:#10141c; }
  .form { display:grid; grid-template-columns:100px 1fr; gap:8px 10px; align-items:center; margin-top:10px; }
  .form > label { color:var(--mute); font-size:12px; }
  .form input, .form select { width:100%; }
  .form .inline { display:flex; gap:6px; } .form .inline select { flex:1; min-width:0; }
  .actions { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; } .actions .danger { margin-right:auto; }
  .stage-row { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
  .stage-row .top { display:flex; gap:6px; align-items:center; }
  .stage-row .top input { flex:1; min-width:0; } .stage-row .top select { max-width:40%; }
  .stage-row textarea { margin-top:6px; font-size:12px; }
  .guide { border:1px dashed var(--run); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px; }
  .guide .ok { color:var(--done); } .guide .todo { color:var(--text); }
  code { background:#0f1218; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<script src="/assets/oneiroverse/splash.js"></script>
<header><h1>🏭 AI 工廠</h1><span id="conn">連線中…</span></header>
<main>
  <div class="col">
    <section><h2>AI 節點 <button class="ghost" id="add-node">＋ 新增 AI</button></h2>
      <div id="guide"></div>
      <div id="factory"></div>
      <div id="node-editor" class="panel" hidden></div>
    </section>
    <section><h2>生產線 <button class="ghost" id="new-pipe">＋ 新增生產線</button></h2>
      <div id="belts"></div>
      <div id="pipe-editor" class="panel" hidden></div>
    </section>
    <section><h2>任務</h2>
      <div id="asks"></div>
      <input id="title" placeholder="任務標題（可留空）" style="width:100%;margin-bottom:6px">
      <textarea id="prompt" rows="3"></textarea>
      <div class="row"><select id="task-pipe" title="要跑哪一條生產線" style="flex:1;min-width:0"></select><button id="go">送進工廠</button></div>
      <div id="tasks" style="margin-top:12px"></div>
    </section>
  </div>
  <div class="col">
    <section><h2>隨時發問</h2>
      <div id="chat"></div>
      <div class="row"><select id="target"></select></div>
      <div class="row"><input id="msg" placeholder="問任何一個 AI…"><button id="send">送出</button></div>
    </section>
    <section><h2>AI 帳號 <button class="ghost" data-acct="refresh">重新整理</button></h2>
      <div id="accounts"></div>
      <div class="row">
        <select id="acct-provider">
          <option value="claude">Claude</option>
          <option value="codex">ChatGPT（Codex）</option>
          <option value="gemini">Gemini（API 金鑰）</option>
          <option value="openai">OpenAI 相容 API</option>
        </select>
        <input id="acct-name" placeholder="帳號名稱，例如：主帳號">
      </div>
      <div class="row"><button data-acct="add" style="flex:1">新增帳號</button></div>
      <div class="hint">每個帳號都在這裡自己登入，不會用到這台電腦上其他程式的登入。本地模型（Ollama）不需要帳號。</div>
    </section>
    <section><h2>即時日誌</h2><div id="log"></div></section>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const S = { nodes:{}, tasks:{}, pipelines:[], accounts:[] };
const bubbles = new Map();   // node id -> 正在串流的對話泡泡（每個節點各自一個）
const taskLive = new Map();  // task id -> 目前階段的即時輸出

const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = { idle:'閒置', running:'執行中', waiting:'等你回答', failed:'失敗', offline:'離線' };
const TASK_STATUS = { queued:'排隊', running:'進行中', waiting_user:'等你回答', done:'完成', blocked:'已阻擋', cancelled:'已取消', interrupted:'已中斷' };
const KINDS = {
  claude: { name:'Claude', provider:'claude', models:['sonnet','opus','haiku'], hint:'sonnet / opus / haiku（留空 = sonnet）' },
  codex:  { name:'ChatGPT（Codex）', provider:'codex', models:[], hint:'留空 = Codex 預設模型' },
  gemini: { name:'Gemini', provider:'gemini', models:[], hint:'留空 = Gemini CLI 預設模型' },
  ollama: { name:'本地模型（Ollama）', provider:null },
  openai: { name:'OpenAI 相容 API', provider:'openai', optional:true, models:[], hint:'必填，例如 gpt-4o-mini、deepseek-chat' },
};
const PROVIDERS = {
  claude: { name:'Claude', cli:true, code:true },
  codex:  { name:'ChatGPT', cli:true },
  gemini: { name:'Gemini', keyHint:'貼上 Google AI Studio 的 API 金鑰' },
  openai: { name:'OpenAI 相容 API', keyHint:'貼上 API 金鑰' },
};
const label = id => S.nodes[id]?.label || id;
const acctName = id => S.accounts.find(a => a.id === id)?.name || '（已移除）';
const setHTML = (el, html) => { if (el._html !== html) { el.innerHTML = html; el._html = html; } };  // 沒變就不重畫，下拉選單才不會被關掉
const ollamaName = m => m.includes(':') ? m : m + ':latest';

function nodeCard(n) {
  const k = KINDS[n.kind] || { name: n.kind }, id = esc(n.id);
  let tools = '';
  if (n.kind === 'ollama' && n.models?.length) {
    const cur = n.models.includes(ollamaName(n.model || '')) ? ollamaName(n.model) : n.effective_model;
    tools = `<select data-model="${id}" title="切換本地模型">${n.models.map(m =>
      `<option${m === cur ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select>`;
  }
  const model = n.kind === 'ollama' ? (n.models?.length ? '' : (n.model ? ' · ' + n.model : '')) : (n.model ? ' · ' + n.model : '');
  const acct = k.provider ? `<div class="role">帳號：${n.account ? esc(acctName(n.account)) : (k.optional ? '不使用金鑰' : '未指定')}</div>` : '';
  return `<div class="node ${esc(n.status)}"><div class="name">${esc(n.label)}</div>
    <div class="role">${esc(k.name + model)}</div>${n.role ? `<div class="role">${esc(n.role)}</div>` : ''}${acct}
    <div class="st"><span class="dot"></span>${esc(STATUS[n.status] || n.status)}</div>
    <div class="role">${esc(n.detail)}</div>
    <div class="tools">${tools}<button class="ghost" data-edit="${id}">設定</button></div></div>`;
}

function renderGuide() {
  const nodes = Object.values(S.nodes), hasPipe = S.pipelines.some(p => p.steps.length);
  if (nodes.length && hasPipe) return setHTML($('#guide'), '');
  const steps = [
    [S.accounts.some(a => a.status?.logged_in) || nodes.some(n => n.kind === 'ollama'), '在右邊「AI 帳號」新增帳號並登入（只用本地模型可以跳過）'],
    [nodes.length > 0, '按「＋ 新增 AI」加入要用的 AI，選擇它的帳號，或選本地模型'],
    [hasPipe, '在「生產線」按「＋ 新增生產線」，設定每個階段由哪個 AI 做什麼'],
  ];
  setHTML($('#guide'), `<div class="guide"><b>開始使用</b>${steps.map(([ok, t], i) =>
    `<div class="${ok ? 'ok' : 'todo'}">${ok ? '✓' : (i + 1) + '.'} ${esc(t)}</div>`).join('')}</div>`);
}

const LIVE = ['queued', 'running', 'waiting_user'];
const openTasks = new Set();  // 展開結果的已結束任務（重畫時保持展開）
const stepKey = steps => JSON.stringify(steps.map(s => [s.name, s.node]));

function taskCard(t) {
  const live = LIVE.includes(t.status), id = esc(t.id);
  const when = new Date(t.created_at * 1000).toLocaleString('zh-TW', { hour12: false });
  const acts = live ? `<button class="ghost" data-cancel="${id}">取消</button>`
    : `<button class="ghost" data-task-copy="${id}">複製</button><button class="ghost" data-task-save="${id}">下載</button>`
      + `<button class="ghost" data-task-del="${id}">刪除</button>`;
  const outs = t.outputs.map(o => `<div class="out"><b>${esc(o.stage)} · ${esc(label(o.node))}</b>\n${esc(o.text)}</div>`).join('');
  return `<div class="task"><span class="acts">${acts}</span><b>${esc(t.title)}</b>
    <span class="badge ${esc(t.status)}">${esc(TASK_STATUS[t.status]||t.status)}</span> ${t.stage ? '· '+esc(t.stage) : ''}
    <div class="meta">${esc(t.pipeline?.name || '')}${t.pipeline ? ' · ' : ''}${esc(when)}</div>
    ${t.error ? `<div class="err">${esc(t.error)}</div>` : ''}
    ${live ? outs + `<div class="out live" id="tl-${id}">${esc(taskLive.get(t.id)||'')}</div>`
      : t.outputs.length ? `<details data-task="${id}"${openTasks.has(t.id) ? ' open' : ''}><summary>結果（${t.outputs.length} 個階段）</summary>${outs}</details>` : ''}</div>`;
}

function render() {
  renderGuide();
  const nodes = Object.values(S.nodes);
  setHTML($('#factory'), nodes.length ? nodes.map(nodeCard).join('') : '<div class="hint">還沒有 AI，按右上角「＋ 新增 AI」。</div>');
  const active = Object.values(S.tasks).filter(t => ['running','waiting_user'].includes(t.status));
  setHTML($('#belts'), S.pipelines.length ? S.pipelines.map(p => {
    const a = active.find(t => t.pipeline?.id === p.id && stepKey(t.steps) === stepKey(p.steps));
    const chips = p.steps.length ? p.steps.map((s, i) => {
      const cls = a ? (i < a.stage_index ? 'past' : i === a.stage_index ? 'current' : '') : '';
      return `<span class="stage ${cls}">${esc(s.name)} · ${esc(label(s.node))}</span>`;
    }).join('<span class="arrow">→</span>') : '<span class="hint">還沒有階段</span>';
    return `<div class="pipe"><div class="pipe-head"><b>${esc(p.name)}</b>
      <button class="ghost" data-pedit="${esc(p.id)}"${pipe ? ' disabled' : ''}>編輯</button></div><div class="belt">${chips}</div></div>`;
  }).join('') : '<span class="hint">還沒有生產線，按右上角「＋ 新增生產線」。</span>');
  const sel = S.pipelines.find(p => p.id === $('#task-pipe').value);
  const ph = sel ? `描述需求，送進「${sel.name}」（${sel.steps.map(s => s.name).join(' → ') || '還沒有階段'}）` : '先在「生產線」新增一條生產線，再把需求送進工廠';
  if ($('#prompt').placeholder !== ph) $('#prompt').placeholder = ph;
  const tasks = Object.values(S.tasks).sort((x, y) => y.created_at - x.created_at);
  setHTML($('#tasks'), tasks.map(taskCard).join(''));
  renderAsks(tasks.filter(t => t.question));
  document.title = tasks.some(t => t.question) ? '❓ AI 需要你回答' : 'AI 工廠';
}

function taskMarkdown(t) {
  const when = new Date(t.created_at * 1000).toLocaleString('zh-TW', { hour12: false });
  let md = `# ${t.title}\n\n- 生產線：${t.pipeline?.name || ''}\n- 建立時間：${when}\n- 狀態：${TASK_STATUS[t.status] || t.status}\n\n## 任務內容\n\n${t.prompt}\n`;
  for (const o of t.outputs) md += `\n## ${o.stage}（${label(o.node)}）\n\n${o.text}\n`;
  if (t.error) md += `\n## 錯誤\n\n${t.error}\n`;
  return md;
}

function downloadTask(t) {
  const d = new Date(t.created_at * 1000), pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([taskMarkdown(t)], { type: 'text/markdown;charset=utf-8' }));
  a.download = `${t.title.replace(/[\\/:*?"<>|\r\n]+/g, '_').slice(0, 60) || '任務'}-${stamp}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// 提問區以任務 id 為鍵增量更新：其他事件觸發重繪時，不會清掉正在輸入的回答。
function renderAsks(pending) {
  const box = $('#asks'), keep = new Set(pending.map(t => t.id + '|' + t.question.text));
  for (const el of [...box.children]) if (!keep.has(el.dataset.key)) el.remove();
  for (const t of pending) {
    const key = t.id + '|' + t.question.text;
    if ([...box.children].some(el => el.dataset.key === key)) continue;
    const div = document.createElement('div');
    div.className = 'ask'; div.dataset.key = key;
    div.innerHTML = `<b>${esc(label(t.question.node))} 需要你回答（${esc(t.title)}）：</b><div>${esc(t.question.text)}</div>
      <div class="row"><input placeholder="你的回答"><button>回覆</button></div>`;
    const input = div.querySelector('input');
    const btn = div.querySelector('button');
    const submit = () => once(btn, async () => { const v = input.value.trim(); if (v && await post(`/api/tasks/${t.id}/answer`, {text: v})) input.value = ''; });
    btn.onclick = submit;
    input.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) submit(); };
    box.appendChild(div);
  }
}

// ---------- 新增 / 設定 AI ----------
let editing = null;  // { id: null 表示新增, kind }
let neModels = { list: [], error: '' };

function editorValues() {
  const v = {};
  $('#node-editor').querySelectorAll('[name]').forEach(el => v[el.name] = el.value);
  return v;
}

function renderEditor(keep) {
  const box = $('#node-editor');
  if (!editing) { box.hidden = true; box.innerHTML = ''; return; }
  const n = editing.id ? S.nodes[editing.id] : null;
  if (editing.id && !n) { editing = null; return renderEditor(); }
  const v = keep || (n ? { label: n.label, model: n.model, account: n.account || '', role: n.role, timeout: n.timeout,
                           host: n.host, base_url: n.base_url } : {});
  const kind = editing.kind, k = KINDS[kind];
  const field = (lbl, html) => `<label>${lbl}</label><div>${html}</div>`;
  const input = (name, extra = '') => `<input name="${name}" value="${esc(v[name] ?? '')}" ${extra}>`;
  let f = field('類型', n ? esc(k.name) : `<select name="kind">${Object.entries(KINDS).map(([key, x]) =>
    `<option value="${key}"${key === kind ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`);
  f += field('名稱', input('label', 'maxlength="40" placeholder="顯示在卡片上，例如：Claude 主力"'));
  if (k.provider) {
    const mine = S.accounts.filter(a => a.provider === k.provider);
    const opts = `<option value="">${k.optional ? '（不使用金鑰）' : '（未指定）'}</option>` + mine.map(a =>
      `<option value="${esc(a.id)}"${a.id === v.account ? ' selected' : ''}>${esc(a.name)}${a.status?.logged_in ? '' : '（未登入）'}</option>`).join('');
    f += field('帳號', `<select name="account">${opts}</select>` + (mine.length ? '' :
      `<div class="hint">還沒有 ${esc(PROVIDERS[k.provider].name)} 帳號，先在右邊「AI 帳號」新增${k.optional ? '（本機伺服器不需要金鑰可略過）' : ''}。</div>`));
  }
  if (kind === 'ollama') {
    const list = neModels.list.slice();
    if (v.model && !list.includes(ollamaName(v.model))) list.unshift(v.model);
    f += field('Ollama 位址', input('host', 'placeholder="127.0.0.1:11434（留空 = 預設）"'));
    f += field('模型', `<div class="inline"><select name="model"><option value="">（自動選第一個）</option>${list.map(m =>
      `<option${ollamaName(m) === ollamaName(v.model || '') ? ' selected' : ''}>${esc(m)}</option>`).join('')}</select>
      <button class="ghost" data-ne="models">重新整理</button></div>` +
      (neModels.error ? `<div class="error">${esc(neModels.error)}</div>` : list.length ? '' : '<div class="hint">還沒有本地模型（ollama pull &lt;模型&gt;）</div>'));
  } else {
    if (kind === 'openai') f += field('API 網址', input('base_url', 'placeholder="https://api.openai.com/v1 或 http://127.0.0.1:1234/v1"'));
    const suggest = [...(k.models || []), ...(n?.models || [])];
    f += field('模型', input('model', `list="ne-models" placeholder="${esc(k.hint)}"`) +
      `<datalist id="ne-models">${suggest.map(m => `<option value="${esc(m)}">`).join('')}</datalist>`);
  }
  f += field('說明', input('role', 'maxlength="60" placeholder="選填，例如：架構 / 審查"'));
  f += field('逾時（秒）', input('timeout', 'type="number" min="30" max="3600" placeholder="留空 = 預設"'));
  box.innerHTML = `<b>${n ? `設定「${esc(n.label)}」` : '新增 AI'}</b><div class="form">${f}</div>
    <div class="error" id="ne-err"></div>
    <div class="actions">${n ? '<button class="danger" data-ne="delete">刪除這個 AI</button>' : ''}
      <button class="plain" data-ne="cancel">取消</button><button data-ne="save">${n ? '儲存' : '新增'}</button></div>`;
  box.hidden = false;
}

async function loadModels() {
  const host = $('#node-editor [name=host]')?.value.trim() || '';
  const r = await api('/api/ollama/models?host=' + encodeURIComponent(host), null, 'GET');
  neModels = r.ok ? { list: r.data.models, error: '' } : { list: [], error: r.error };
  if (editing?.kind === 'ollama') renderEditor(editorValues());
}

function openEditor(id) {
  const n = id ? S.nodes[id] : null;
  editing = { id: id || null, kind: n ? n.kind : 'claude' };
  neModels = { list: n?.models || [], error: '' };
  renderEditor();
  if (editing.kind === 'ollama') loadModels();
  $('#node-editor').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const EDITOR = {
  cancel: () => { editing = null; renderEditor(); },
  models: () => loadModels(),
  save: async () => {
    const v = editorValues(), k = KINDS[editing.kind];
    const body = { label: v.label, model: v.model, role: v.role, timeout: v.timeout ? Number(v.timeout) : null };
    if (k.provider) body.account = v.account || null;
    if (editing.kind === 'ollama') body.host = v.host;
    if (editing.kind === 'openai') body.base_url = v.base_url;
    const r = editing.id ? await api(`/api/nodes/${editing.id}`, body, 'PATCH') : await api('/api/nodes', { kind: editing.kind, ...body });
    if (r.ok) { editing = null; renderEditor(); } else $('#ne-err').textContent = r.error;
  },
  delete: async () => {
    if (!confirm(`刪除「${label(editing.id)}」？`)) return;
    const r = await api(`/api/nodes/${editing.id}`, null, 'DELETE');
    if (r.ok) { editing = null; renderEditor(); } else $('#ne-err').textContent = r.error;
  },
};

// ---------- 生產線編輯 ----------
let pipe = null;  // 編輯中的草稿：{ id（新增時是 null）, name, steps }
const newStage = () => ({ name: '', node: Object.keys(S.nodes)[0] || '', template: '{input}' });

function openPipe(id) {
  const p = S.pipelines.find(x => x.id === id);
  pipe = p ? { id: p.id, name: p.name, steps: p.steps.map(s => ({...s})) } : { id: null, name: '', steps: [newStage()] };
  renderPipe();
  render();
  $('#pipe-editor').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderPipe() {
  const box = $('#pipe-editor');
  $('#new-pipe').hidden = !!pipe;
  if (!pipe) { box.hidden = true; box.innerHTML = ''; return; }
  const nodes = Object.values(S.nodes), steps = pipe.steps;
  for (const s of steps) if (!S.nodes[s.node]) s.node = nodes[0]?.id || '';
  box.innerHTML = `<b>${pipe.id ? '編輯生產線' : '新增生產線'}</b>
    <div class="row" style="margin-bottom:8px"><input data-pname value="${esc(pipe.name)}" maxlength="30" placeholder="生產線名稱，例如：遊戲企劃"></div>
    <div class="hint" style="margin:0 0 8px">指令裡的 <code>{input}</code> 會換成上一階段的輸出（第一階段是任務內容），
      <code>{task}</code> 會換成原始任務內容（例如讓「審查」對照原始需求）。</div>` +
    steps.map((s, i) => `<div class="stage-row"><div class="top"><b>${i + 1}</b>
      <input data-i="${i}" data-f="name" value="${esc(s.name)}" maxlength="30" placeholder="階段名稱，例如：分析">
      <select data-i="${i}" data-f="node">${nodes.length ? nodes.map(n =>
        `<option value="${esc(n.id)}"${n.id === s.node ? ' selected' : ''}>${esc(n.label)}</option>`).join('') : '<option value="">（先新增 AI）</option>'}</select>
      <button class="ghost" data-p="up" data-i="${i}"${i ? '' : ' disabled'} title="上移">↑</button>
      <button class="ghost" data-p="down" data-i="${i}"${i < steps.length - 1 ? '' : ' disabled'} title="下移">↓</button>
      <button class="ghost" data-p="del" data-i="${i}" title="刪除這個階段">✕</button></div>
      <textarea rows="3" data-i="${i}" data-f="template" placeholder="給這個 AI 的指令，要包含 {input} 或 {task}">${esc(s.template)}</textarea></div>`).join('') +
    `<button class="ghost" data-p="add">＋ 新增階段</button><div class="error" id="pe-err"></div>
    <div class="actions">${pipe.id ? '<button class="danger" data-p="remove">刪除這條生產線</button>' : ''}
      <button class="plain" data-p="cancel">取消</button><button data-p="save">儲存生產線</button></div>`;
  box.hidden = false;
}

const PIPE = {
  add: () => pipe.steps.push(newStage()),
  del: i => pipe.steps.splice(i, 1),
  up: i => pipe.steps.splice(i - 1, 0, ...pipe.steps.splice(i, 1)),
  down: i => pipe.steps.splice(i + 1, 0, ...pipe.steps.splice(i, 1)),
  cancel: () => { pipe = null; },
  save: async () => {
    const body = { name: pipe.name, steps: pipe.steps };
    const r = pipe.id ? await api(`/api/pipelines/${pipe.id}`, body, 'PUT') : await api('/api/pipelines', body);
    if (!r.ok) { $('#pe-err').textContent = r.error; return false; }
    if (!pipe.id) $('#task-pipe').value = r.data.id;  // 新的生產線順便選起來
    pipe = null;
  },
  remove: async () => {
    if (!confirm(`刪除生產線「${pipe.name}」？進行中的任務會照原本的流程跑完。`)) return false;
    const r = await api(`/api/pipelines/${pipe.id}`, null, 'DELETE');
    if (!r.ok) { $('#pe-err').textContent = r.error; return false; }
    pipe = null;
  },
};

// ---------- 帳號 ----------
const rekey = new Set();  // 正在更換金鑰的帳號

function acctCard(a, byEmail) {
  const p = PROVIDERS[a.provider] || { name: a.provider }, st = a.status, id = esc(a.id);
  const btn = (act, text) => `<button class="ghost" data-acct="${act}" data-id="${id}">${text}</button>`;
  let who, btns, body = '';
  if (p.cli) {
    who = a.login ? '登入中…' : !st ? '檢查中…' : st.logged_in ? `${st.email || '已登入'}${st.plan ? ' · ' + st.plan : ''}`
        : st.logged_in === false ? '未登入' : `無法確認登入狀態：${st.error || ''}`;
    btns = a.login ? btn('cancel', '取消登入') : (st?.logged_in ? btn('logout', '登出') : btn('login', '登入')) + btn('remove', '移除');
    if (a.login) {
      const url = a.login.url?.startsWith('https://') ? a.login.url : '';
      body = `<div class="hint">已在瀏覽器開啟登入頁，完成後這裡會自動更新。<br>
          瀏覽器登入的是別的帳號？把下面的網址貼到無痕視窗登入${p.code ? '，再把頁面上的授權碼貼回來' : '（要在這台電腦上開）'}。</div>
        ${url ? `<div class="url"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a> ${btn('copy', '複製網址')}</div>`
              : '<div class="hint">取得登入網址中…</div>'}
        ${p.code ? `<div class="row"><input data-code="${id}" placeholder="貼上授權碼"><button data-acct="code" data-id="${id}">送出</button></div>` : ''}`;
    }
  } else {
    const has = st?.logged_in;
    who = has ? `已設定金鑰 ${a.key_hint}` : '還沒有輸入 API 金鑰';
    btns = (has ? btn('rekey', '更換金鑰') + btn('logout', '清除金鑰') : '') + btn('remove', '移除');
    if (!has || rekey.has(a.id)) body = `<div class="row"><input type="password" autocomplete="off" data-key="${id}"
      placeholder="${esc(p.keyHint)}"><button data-acct="key" data-id="${id}">儲存</button></div>`;
  }
  const same = st?.email ? (byEmail[a.provider + st.email] || []).filter(x => x !== a.name) : [];
  return `<div class="acct"><div class="head"><b>${esc(a.name)}</b><span class="tag">${esc(p.name)}</span><span class="btns">${btns}</span></div>
    <div class="role">${esc(who)}</div>
    ${same.length ? `<div class="err">和「${esc(same.join('、'))}」是同一個帳號</div>` : ''}
    ${a.error ? `<div class="err">${esc(a.error)}</div>` : ''}${body}</div>`;
}

// 帳號面板只在帳號 / 快照事件時重繪（不跟著串流），並保留正在輸入的授權碼與金鑰。
function renderAccounts() {
  const box = $('#accounts');
  const keyOf = el => el.dataset.code ? 'c' + el.dataset.code : el.dataset.key ? 'k' + el.dataset.key : null;
  const typed = {};
  box.querySelectorAll('input[data-code],input[data-key]').forEach(i => typed[keyOf(i)] = i.value);
  const focused = box.contains(document.activeElement) ? keyOf(document.activeElement) : null;
  const byEmail = {};
  for (const a of S.accounts) if (a.status?.email) (byEmail[a.provider + a.status.email] ||= []).push(a.name);
  box.innerHTML = S.accounts.length ? S.accounts.map(a => acctCard(a, byEmail)).join('')
    : '<div class="hint" style="margin-bottom:8px">還沒有帳號。選擇類型、取個名稱，再按「新增帳號」。</div>';
  box.querySelectorAll('input[data-code],input[data-key]').forEach(i => {
    i.value = typed[keyOf(i)] || '';
    if (keyOf(i) === focused) i.focus();
  });
}

function syncTargets() {
  const sel = $('#target'), prev = sel.value, nodes = Object.values(S.nodes);
  sel.innerHTML = nodes.length ? nodes.map(n => `<option value="${esc(n.id)}">${esc(n.label)}</option>`).join('') : '<option value="">（還沒有 AI）</option>';
  if (S.nodes[prev]) sel.value = prev;
}

function syncPipeSelect() {
  const sel = $('#task-pipe'), prev = sel.value;
  sel.innerHTML = S.pipelines.length ? S.pipelines.map(p =>
    `<option value="${esc(p.id)}"${p.steps.length ? '' : ' disabled'}>${esc(p.name)}${p.steps.length ? '' : '（還沒有階段）'}</option>`).join('')
    : '<option value="">（還沒有生產線）</option>';
  const usable = S.pipelines.filter(p => p.steps.length);
  sel.value = usable.some(p => p.id === prev) ? prev : (usable[0]?.id || '');
}

function log(text, cls='') { const l = $('#log'); l.insertAdjacentHTML('beforeend', `<div class="${cls}">${esc(text)}</div>`); l.scrollTop = l.scrollHeight; }
function chatLine(who, cls, text) { const c = $('#chat'); c.insertAdjacentHTML('beforeend', `<div class="${cls}"><span class="src">${esc(who)}：</span><span></span></div>`); c.lastElementChild.lastElementChild.textContent = text; c.scrollTop = c.scrollHeight; return c.lastElementChild; }
function bubbleFor(node) { if (!bubbles.has(node)) bubbles.set(node, chatLine(label(node), 'ai', '')); return bubbles.get(node).lastElementChild; }
function closeBubbles(note) { for (const b of bubbles.values()) if (note) b.lastElementChild.textContent += note; bubbles.clear(); }

function applyConfig(ev) {
  S.nodes = Object.fromEntries(ev.nodes.map(n => [n.id, n]));
  S.pipelines = ev.pipelines;
  syncTargets();
  syncPipeSelect();
  if (editing?.id && !S.nodes[editing.id]) { editing = null; renderEditor(); }
  if (pipe?.id && !S.pipelines.some(p => p.id === pipe.id)) pipe = null;  // 被刪掉了
  renderPipe();
}

function onEvent(ev) {
  switch (ev.type) {
    case 'snapshot':
      closeBubbles('（連線中斷）');
      taskLive.clear();
      S.tasks = Object.fromEntries(ev.tasks.map(t=>[t.id,t]));
      S.accounts = ev.accounts || [];
      applyConfig(ev);
      renderAccounts();
      break;
    case 'config': applyConfig(ev); break;
    case 'node': if (S.nodes[ev.node.id]) S.nodes[ev.node.id] = ev.node; break;
    case 'accounts':
      S.accounts = ev.accounts; renderAccounts();
      if (editing) renderEditor(editorValues());  // 帳號選單跟著更新
      break;
    case 'task': {
      const old = S.tasks[ev.task.id];
      if (!old || old.stage !== ev.task.stage) taskLive.delete(ev.task.id);
      S.tasks[ev.task.id] = ev.task; break;
    }
    case 'task_removed': delete S.tasks[ev.id]; taskLive.delete(ev.id); openTasks.delete(ev.id); break;
    case 'log': log(ev.text, ev.level === 'error' ? 'err' : ''); break;
    case 'ask': log(`❓ ${label(ev.node)} 提問：${ev.text}`, 'err'); try { new Notification('AI 需要你回答', {body: ev.text}); } catch {} break;
    case 'attempt':  // 新的一次呼叫：丟掉上一次（失敗或提問前）的半截輸出
      if (ev.task_id) {
        taskLive.delete(ev.task_id);
        const el = document.getElementById('tl-' + ev.task_id);
        if (el) el.textContent = '';
      } else if (ev.attempt > 1 && bubbles.has(ev.node)) bubbleFor(ev.node).textContent = '';
      return;
    case 'chunk':
      if (ev.task_id) {
        taskLive.set(ev.task_id, (taskLive.get(ev.task_id)||'') + ev.text);
        const el = document.getElementById('tl-' + ev.task_id);
        if (el) { el.textContent = taskLive.get(ev.task_id); el.scrollTop = el.scrollHeight; }
      } else { bubbleFor(ev.node).textContent += ev.text; $('#chat').scrollTop = 1e9; }
      return;
    case 'chat':
      if (ev.role === 'user') { chatLine('你', 'me', ev.text); break; }
      { const b = bubbleFor(ev.node); b.textContent = ev.text; if (ev.ok === false) b.parentElement.classList.add('err'); bubbles.delete(ev.node); }
      break;
  }
  render();
}

let backoff = 500;
function connect() {
  const ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws');
  ws.onopen = () => { $('#conn').textContent = '● 已連線'; backoff = 500; };
  ws.onmessage = m => onEvent(JSON.parse(m.data));
  ws.onclose = () => { $('#conn').textContent = '○ 斷線，重連中…'; setTimeout(connect, backoff); backoff = Math.min(backoff*2, 8000); };
}
connect();

// 瀏覽器（例如 Firefox）只允許在使用者點擊時要求通知權限。
let asked = false;
document.addEventListener('click', () => { if (asked) return; asked = true; try { if (Notification.permission === 'default') Notification.requestPermission(); } catch {} });

async function api(url, body, method='POST') {
  try {
    const r = await fetch(url, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
    const d = await r.json().catch(() => ({}));
    if (r.ok) return { ok: true, data: d };
    const msg = typeof d.detail === 'string' ? d.detail : Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('；') : `${r.status} ${r.statusText}`;
    return { ok: false, error: msg };
  } catch (e) { return { ok: false, error: `無法連到伺服器：${e.message}` }; }
}
async function post(url, body, method='POST') {
  const r = await api(url, body, method);
  if (!r.ok) log(r.error, 'err');
  return r.ok;
}
// 送出期間鎖住按鈕，避免連點或連按 Enter 重複送出；失敗時保留輸入內容。
async function once(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true;
  try { await fn(); } finally { btn.disabled = false; }
}
$('#go').onclick = () => once($('#go'), async () => {
  const p = $('#prompt').value.trim(); if (!p) return;
  const body = {title: $('#title').value.trim(), prompt: p, pipeline: $('#task-pipe').value || null};
  if (await post('/api/tasks', body)) { $('#prompt').value = ''; $('#title').value = ''; }
});
const send = () => once($('#send'), async () => {
  const m = $('#msg').value.trim();
  if (m && $('#target').value && await post('/api/chat', {node: $('#target').value, message: m})) $('#msg').value = '';
});
$('#send').onclick = send; $('#msg').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) send(); };
$('#add-node').onclick = () => openEditor(null);
$('#new-pipe').onclick = () => openPipe(null);

const ACCT = {
  refresh: () => post('/api/accounts/refresh'),
  add: async () => {
    const n = $('#acct-name').value.trim();
    if (n && await post('/api/accounts', {name: n, provider: $('#acct-provider').value})) $('#acct-name').value = '';
  },
  login: id => post(`/api/accounts/${id}/login`),
  cancel: id => post(`/api/accounts/${id}/cancel`),
  logout: id => {
    const a = S.accounts.find(x => x.id === id), cli = PROVIDERS[a.provider]?.cli;
    return confirm(cli ? `登出「${a.name}」？` : `清除「${a.name}」的 API 金鑰？`) && post(`/api/accounts/${id}/logout`);
  },
  remove: id => {
    const a = S.accounts.find(x => x.id === id), cli = PROVIDERS[a.provider]?.cli;
    return confirm(`移除「${a.name}」？\n${cli ? '會先登出這個帳號。' : '會一併刪除它的 API 金鑰。'}用這個帳號的 AI 會變成「未指定帳號」。`)
      && post(`/api/accounts/${id}`, null, 'DELETE');
  },
  copy: id => navigator.clipboard?.writeText(S.accounts.find(x => x.id === id)?.login?.url || ''),
  code: async id => {
    const i = document.querySelector(`input[data-code="${CSS.escape(id)}"]`), v = i?.value.trim();
    if (v && await post(`/api/accounts/${id}/code`, {code: v})) i.value = '';
  },
  key: async id => {
    const i = document.querySelector(`input[data-key="${CSS.escape(id)}"]`), v = i?.value.trim();
    if (v && await post(`/api/accounts/${id}/key`, {key: v})) { i.value = ''; rekey.delete(id); renderAccounts(); }
  },
  rekey: id => { rekey.add(id); renderAccounts(); },
};

document.addEventListener('click', e => {
  const t = e.target, d = t.dataset || {};
  if (d.cancel) post(`/api/tasks/${d.cancel}/cancel`);
  else if (d.taskCopy) navigator.clipboard?.writeText(taskMarkdown(S.tasks[d.taskCopy])).then(() => log('已複製任務結果（Markdown）'), e => log(`複製失敗：${e.message}`, 'err'));
  else if (d.taskSave) downloadTask(S.tasks[d.taskSave]);
  else if (d.taskDel) { if (confirm(`刪除任務「${S.tasks[d.taskDel]?.title}」？`)) post(`/api/tasks/${d.taskDel}`, null, 'DELETE'); }
  else if (d.pedit) openPipe(d.pedit);
  else if (d.edit) openEditor(d.edit);
  else if (d.acct && ACCT[d.acct]) once(t, () => ACCT[d.acct](d.id));
  else if (d.ne && EDITOR[d.ne]) once(t, EDITOR[d.ne]);
  else if (d.p && PIPE[d.p]) once(t, async () => { if (await PIPE[d.p](Number(d.i)) !== false) { renderPipe(); render(); } });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const d = e.target.dataset || {};
  if (e.target.id === 'acct-name') ACCT.add();
  else if (d.code) ACCT.code(d.code);
  else if (d.key) ACCT.key(d.key);
});
document.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (!pipe || !$('#pipe-editor').contains(e.target)) return;
  if (d.f) pipe.steps[Number(d.i)][d.f] = e.target.value;
  else if ('pname' in d) pipe.name = e.target.value;
});
document.addEventListener('toggle', e => {  // 記住哪些任務的結果是展開的
  const id = e.target.dataset?.task;
  if (id) e.target.open ? openTasks.add(id) : openTasks.delete(id);
}, true);
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset || {};
  if (d.model) post(`/api/nodes/${d.model}`, {model: t.value}, 'PATCH');  // 卡片上直接切換本地模型
  else if (t.name === 'kind' && editing) { editing.kind = t.value; neModels = { list: [], error: '' }; renderEditor({ ...editorValues(), model: '', account: '' }); if (t.value === 'ollama') loadModels(); }
  else if (t.name === 'host' && editing?.kind === 'ollama') loadModels();
  else if (pipe && d.f && $('#pipe-editor').contains(t)) pipe.steps[Number(d.i)][d.f] = t.value;
  else if (t.id === 'task-pipe') render();
});
post('/api/accounts/refresh');  // 開頁時查一次登入狀態
</script>
</body>
